<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c3a">
<title>大富翁</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#123c3a;--paper:#fbf4e4;--ink:#2b2b2b;--accent:#e85d3f;--gold:#f2b544;--green:#2f7d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 0,#1d5a55,var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:8px 8px calc(20px + env(safe-area-inset-bottom))}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--paper);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--accent);color:#fff;margin:8px 0;box-shadow:0 3px 0 #a63a22;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a63a22}
.btn.alt{background:var(--green);box-shadow:0 3px 0 #1d5146}
.btn.ghost{background:#e9dfc8;color:#333;box-shadow:0 3px 0 #c7b994}
.btn:disabled{opacity:.4;pointer-events:none}
.mini{border:0;border-radius:8px;padding:6px 10px;font-size:13px;background:rgba(255,255,255,.15);color:#fff;font-family:inherit;cursor:pointer}
.mini.warn{background:var(--accent)}
.mini.dark{background:#ddd0b0;color:#333}
input,select{width:100%;font-size:16px;padding:11px;border-radius:10px;border:2px solid #d9cba8;background:#fff;margin:6px 0;font-family:inherit}
label{font-size:13px;color:#666}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.row .btn{width:auto;padding:12px 20px;margin:6px 0}
.row2{display:flex;gap:6px}.row2 .btn{flex:1}
.hint{font-size:12px;color:#777;margin:4px 0}
.hero{text-align:center;color:#fff;padding:22px 0 6px}
.hero .logo{font-size:46px}
.hero h1{font-size:40px;margin:0;letter-spacing:6px;color:var(--gold);text-shadow:0 3px 0 #7a4b0c}
.hero p{margin:6px 0;opacity:.85}
.top{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;padding:2px 0 8px;flex-wrap:wrap}
.top .sp{flex:1}
.code{font-size:56px;font-weight:900;letter-spacing:10px;color:var(--accent);text-align:center}
.ct{text-align:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.lp{padding:8px 0;border-bottom:1px dashed #d9cba8;font-size:16px}
.lp:last-child{border:0}
/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:2px;width:100%;aspect-ratio:1;background:#0b2a28;padding:3px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.cell{background:var(--paper);border-radius:4px;position:relative;overflow:hidden;font-size:clamp(9px,2.7vw,13px);display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.15;cursor:pointer;min-width:0}
.cell.corner{background:#f6e7c4}
.band{width:100%;height:17%;flex:none}
.nm{font-weight:800;margin-top:2px;white-space:nowrap}
.pr{font-size:.78em;color:#777;white-space:nowrap}
.lv{font-size:.72em;letter-spacing:-2px;white-space:nowrap}
.ic{font-size:1.5em;margin-top:6%}
.center{grid-row:2/7;grid-column:2/7;background:#e7efe2;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;gap:3px;text-align:center;overflow:hidden}
.turn{font-size:15px;font-weight:800}
/* dice */
.dice{display:flex;gap:10px;margin:2px 0 4px}
.die{width:44px;height:44px;background:#fff;border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;box-shadow:inset 0 -4px 0 #e2dccd,0 3px 6px rgba(0,0,0,.25)}
.die i{border-radius:50%}
.die i.on{background:#2b2b2b}
.die.one i.on{background:#e53935;transform:scale(1.3)}
.die.rolling{animation:tumble .24s linear infinite}
.die.rolling+.die.rolling{animation-direction:reverse;animation-duration:.2s}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.die.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.3)}60%{transform:scale(.9)}100%{transform:scale(1)}}
/* pieces */
.board{position:relative}
.pieces{position:absolute;inset:3px;pointer-events:none;z-index:5}
.piece{position:absolute;width:6.2%;transform:translate(-50%,-92%);transition:left .2s ease,top .2s ease}
.piece.snap{transition:none!important}
.pawn{width:100%;transform-origin:50% 100%}
.pawn svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.5))}
.piece.active .pawn{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-16%)}}
.float{position:absolute;transform:translate(-50%,-200%);color:#1b8a3a;font-weight:900;font-size:14px;text-shadow:0 0 3px #fff,0 0 3px #fff;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{to{transform:translate(-50%,-420%);opacity:0}}
.pawnmini{display:inline-block;width:14px;vertical-align:-3px;margin-right:5px}
.moving{color:#555}
.msg{font-size:12.5px;color:#444;min-height:2.4em;max-height:3.6em;overflow:hidden}
.cardmsg{font-size:12.5px;background:#fff3c4;border:2px solid var(--gold);border-radius:8px;padding:4px 8px;max-height:4.2em;overflow:hidden}
.cardmsg.item{background:#e3f1ff;border-color:#4a90d9}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}60%{transform:scale(1.08) rotate(1deg)}100%{transform:none}}
/* hand */
.hand{margin-top:12px}
.hand h3{display:flex;align-items:center;gap:4px}
.itms{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.itm{flex:0 0 31%;min-width:96px;border:0;border-radius:12px;padding:10px 6px;background:linear-gradient(160deg,#ffffff,#dcecff);box-shadow:0 3px 0 #9fbfe0;font-family:inherit;cursor:pointer;text-align:center}
.itm .ii{font-size:28px;line-height:1.1}
.itm .in{font-size:12.5px;font-weight:800;color:#234;margin-top:2px}
.itm .it{font-size:10.5px;color:#4a6a8a;margin-top:2px}
.itm.passive{background:linear-gradient(160deg,#ffffff,#e4f5e1);box-shadow:0 3px 0 #a6cf9f}
.itm:active{transform:translateY(2px)}
.bigcard{text-align:center;padding:10px 0 4px}
.bigcard .ii{font-size:56px}
.opts .btn{padding:10px;font-size:15px;margin:6px 0}
.actions{width:100%}
.actions .btn{padding:9px;font-size:14px;margin:4px 0}
.big{font-size:44px}
/* players */
.players{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.pl{background:var(--paper);border-radius:10px;padding:7px 9px;border-left:7px solid;font-size:13px}
.pl.turn{box-shadow:0 0 0 3px var(--gold)}
.pl.out{opacity:.4}
.pn{font-weight:800}
.pc{font-size:17px;font-weight:900;color:var(--green)}
.ps{font-size:11.5px;color:#666}
.log{max-height:220px;overflow:auto;font-size:13px}
.log div{padding:3px 0;border-bottom:1px dotted #e0d4b4}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal.hidden{display:none}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:4px 0 8px}
.gband{display:inline-block;padding:2px 10px;border-radius:20px;color:#fff;font-size:12px;font-weight:700}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt td{padding:5px 2px;border-bottom:1px dashed #d9cba8}
.rt td:last-child{text-align:right;font-weight:700}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.toast.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
// ==ENGINE START==
// 遊戲規則引擎：只由房主（或單機模式）執行，其他手機只接收狀態
const START_CASH = 15000, PASS_GO = 2000, JAIL_FINE = 500, JAIL_POS = 6, MAX_LEVEL = 4;
const COLORS = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#00897b'];
const GROUPS = [
  { name: '東北', color: '#a1887f' },
  { name: '花東澎', color: '#4fc3f7' },
  { name: '南部', color: '#f06292' },
  { name: '中部', color: '#ffb74d' },
  { name: '桃竹苗', color: '#81c784' },
  { name: '雙北', color: '#7986cb' },
];
const BOARD = [
  { t: 'start', n: '起點' },
  { t: 'prop', n: '基隆', g: 0, p: 600 },
  { t: 'prop', n: '宜蘭', g: 0, p: 700 },
  { t: 'chance', n: '機會' },
  { t: 'prop', n: '花蓮', g: 1, p: 1000 },
  { t: 'prop', n: '台東', g: 1, p: 1000 },
  { t: 'jail', n: '監獄' },
  { t: 'prop', n: '澎湖', g: 1, p: 1200 },
  { t: 'prop', n: '屏東', g: 2, p: 1400 },
  { t: 'policy', n: '政策' },
  { t: 'prop', n: '台南', g: 2, p: 1400 },
  { t: 'prop', n: '高雄', g: 2, p: 1600 },
  { t: 'park', n: '公園' },
  { t: 'prop', n: '嘉義', g: 3, p: 1800 },
  { t: 'prop', n: '彰化', g: 3, p: 1800 },
  { t: 'tax', n: '所得稅', amt: 1000 },
  { t: 'prop', n: '台中', g: 3, p: 2000 },
  { t: 'prop', n: '苗栗', g: 4, p: 2200 },
  { t: 'gotojail', n: '入獄' },
  { t: 'prop', n: '新竹', g: 4, p: 2200 },
  { t: 'prop', n: '桃園', g: 4, p: 2400 },
  { t: 'chance', n: '機會' },
  { t: 'prop', n: '新北', g: 5, p: 2800 },
  { t: 'prop', n: '台北', g: 5, p: 3200 },
];
const RENT_MULT = [1, 5, 15, 30, 45]; // 空地、1~3 棟房子、飯店
const CARDS = [
  { text: '前進到起點，領取 2000 元', k: 'goto', v: 0 },
  { text: '統一發票中獎，獲得 1000 元', k: 'gain', v: 1000 },
  { text: '闖紅燈被開罰單，繳 600 元', k: 'pay', v: 600 },
  { text: '今天是你生日！每位玩家送你 300 元', k: 'birthday', v: 300 },
  { text: '請大家吃雞排，付給每位玩家 200 元', k: 'treat', v: 200 },
  { text: '搭上順風車，前進 3 格', k: 'step', v: 3 },
  { text: '忘了帶錢包，後退 3 格', k: 'step', v: -3 },
  { text: '逃漏稅被查到，直接入獄', k: 'jail' },
  { text: '獲得「出獄許可證」，可以留著之後用', k: 'jailcard' },
  { text: '房屋修繕：每棟房子付 250 元，每間飯店付 1000 元', k: 'repair' },
  { text: '搭高鐵直達台北', k: 'goto', v: 23 },
  { text: '去高雄看演唱會', k: 'goto', v: 11 },
  { text: '股票大漲，獲利 1500 元', k: 'gain', v: 1500 },
  { text: '颱風來襲，修理費 800 元', k: 'pay', v: 800 },
  { text: '撿到錢包送警局，獲得獎金 500 元', k: 'gain', v: 500 },
  { text: '健保補充保費，繳 400 元', k: 'pay', v: 400 },
  { text: '立法院三讀通過新政策，獲得一張政策卡', k: 'item' },
];

// 政策卡（道具卡）：名稱取自台灣爭議較少的政策，效果為遊戲化設計
const HAND_MAX = 3;
const ITEMS = {
  triple: { name: '振興三倍券', icon: '🎟️', n: 2, desc: '付 1000 元，換到 3000 元。' },
  childcare: { name: '育兒津貼', icon: '🍼', n: 2, desc: '領 2000 元。' },
  tpass: { name: 'TPASS 通勤月票', icon: '🚇', n: 2, target: 'steps', desc: '這回合不擲骰，自己選擇前進 1～6 格。要在擲骰前、不在監獄時使用。' },
  travel: { name: '國旅補助', icon: '🧳', n: 1, target: 'cell', desc: '這回合不擲骰，直接往前走到任一塊地產，經過起點照領。要在擲骰前、不在監獄時使用。' },
  social: { name: '社會住宅', icon: '🏢', n: 2, target: 'cell', desc: '在自己可以蓋房的地上免費蓋一棟房子（仍要集滿同區、平均蓋）。' },
  realprice: { name: '實價登錄', icon: '📋', n: 2, target: 'cell', desc: '用 7 折價格買下任一塊還沒有人買的地。' },
  recycle: { name: '資源回收', icon: '♻️', n: 1, target: 'cell', desc: '把自己一塊沒有房子的地，以全額地價賣回銀行。' },
  yield: { name: '禮讓行人', icon: '🚸', n: 2, target: 'player', desc: '指定一位其他玩家，下次輪到他時暫停一回合。' },
  nhi: { name: '全民健保', icon: '🏥', n: 2, passive: true, desc: '自動生效：下一次要付稅金、罰款、修繕費或保釋金給銀行時，免繳一次。' },
  rent: { name: '租金補貼', icon: '🏘️', n: 2, passive: true, desc: '自動生效：下一次付過路費時，由政府全額補貼（地主照收）。' },
};
const ITEM_DECK = [].concat(...Object.keys(ITEMS).map(k => Array(ITEMS[k].n).fill(k)));

let s; // 目前處理中的狀態
const P = id => s.players.find(p => p.id === id);
const cur = () => s.players[s.turn];
function log(msg) { s.log.push(msg); if (s.log.length > 60) s.log.shift(); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const round10 = x => Math.round(x / 10) * 10;
const baseRent = i => round10(BOARD[i].p * 0.1);
const buildCost = i => round10(BOARD[i].p * 0.5);
const validIdx = i => Number.isInteger(i) && BOARD[i] && BOARD[i].t === 'prop';
function groupIdx(g) { const r = []; BOARD.forEach((b, i) => { if (b.t === 'prop' && b.g === g) r.push(i); }); return r; }
function ownsGroup(st, pid, g) { return !!pid && groupIdx(g).every(i => st.props[i].owner === pid); }
function rentOf(st, i) {
  const pr = st.props[i]; let r = baseRent(i) * RENT_MULT[pr.level];
  if (pr.level === 0 && ownsGroup(st, pr.owner, BOARD[i].g)) r *= 2;
  return r;
}
function netWorth(st, p) {
  let w = p.cash;
  for (const k in st.props) { const pr = st.props[k]; if (pr.owner === p.id) w += BOARD[k].p + pr.level * buildCost(+k); }
  return w;
}
function canBuild(st, pid, i, free) {
  const b = BOARD[i], pr = st.props[i], p = st.players.find(x => x.id === pid);
  if (!pr || pr.owner !== pid) return '這不是你的地';
  if (pr.level >= MAX_LEVEL) return '已經蓋到飯店了';
  if (!ownsGroup(st, pid, b.g)) return `要集滿「${GROUPS[b.g].name}」所有地產才能蓋房子`;
  const minLv = Math.min(...groupIdx(b.g).map(j => st.props[j].level));
  if (pr.level > minLv) return '要平均蓋：先蓋同區房子比較少的地';
  if (!free && p.cash < buildCost(i)) return '現金不夠';
  return '';
}
function canSell(st, pid, i) {
  const b = BOARD[i], pr = st.props[i];
  if (!pr || pr.owner !== pid) return '這不是你的地';
  const lvls = groupIdx(b.g).map(j => st.props[j].owner === pid ? st.props[j].level : 0);
  if (pr.level > 0 && pr.level < Math.max(...lvls)) return '要平均賣：先賣同區房子比較多的地';
  if (pr.level === 0 && Math.max(...lvls) > 0) return '要先賣掉同區的房子才能賣地';
  return '';
}
const sellValue = (st, i) => st.props[i].level > 0 ? buildCost(i) / 2 : BOARD[i].p / 2;

function createState(hostId) {
  return { phase: 'lobby', hostId, players: [], props: {}, turn: 0, startTurn: 0, round: 1, maxRounds: 20,
    step: 'roll', dice: [1, 1], rollId: 0, doubles: 0, extraRoll: false, pendingBuy: null,
    log: [], deck: [], itemDeck: [], itemUsed: false, lastCard: null, cardId: 0, winner: null, gameId: 0, moves: [], moveId: 0 };
}
function addPlayer(st, id, name) {
  const used = st.players.map(p => p.color);
  const color = COLORS.find(c => !used.includes(c)) || COLORS[0];
  const p = { id, name, color, connected: true, cash: START_CASH, pos: 0, inJail: false, jailTurns: 0, jailCards: 0, bankrupt: false, items: [], skip: false };
  st.players.push(p);
  return p;
}
function startGame(st) {
  s = st;
  s.phase = 'playing'; s.props = {}; s.gameId = (s.gameId || 0) + 1; s.moves = []; s.moveId = s.moveId || 0;
  BOARD.forEach((b, i) => { if (b.t === 'prop') s.props[i] = { owner: null, level: 0 }; });
  s.players.forEach(p => Object.assign(p, { cash: START_CASH, pos: 0, inJail: false, jailTurns: 0, jailCards: 0, bankrupt: false, items: [], skip: false }));
  s.turn = Math.floor(Math.random() * s.players.length); s.startTurn = s.turn; s.round = 1;
  Object.assign(s, { step: 'roll', doubles: 0, extraRoll: false, pendingBuy: null, log: [], lastCard: null, winner: null, dice: [1, 1] });
  s.deck = shuffle([...CARDS.keys()]); s.itemDeck = shuffle(ITEM_DECK.slice()); s.itemUsed = false;
  log(`🎲 遊戲開始！每人起始資金 ${START_CASH} 元`);
  log(`由 ${cur().name} 先擲骰`);
}

function act(st, pid, a) {
  s = st;
  if (s.phase !== 'playing' || !a) return false;
  const p = P(pid);
  if (!p || p.bankrupt || cur().id !== pid) return false;
  switch (a.type) {
    case 'roll': if (s.step !== 'roll') return false; s.lastCard = null; doRoll(p); break;
    case 'buy': if (s.step !== 'buy') return false; doBuy(p); break;
    case 'pass': if (s.step !== 'buy') return false; log(`${p.name} 決定不買${BOARD[s.pendingBuy].n}`); afterLand(p); break;
    case 'end': if (s.step !== 'end') return false; nextTurn(); break;
    case 'payJail':
      if (s.step !== 'roll' || !p.inJail || p.cash < JAIL_FINE) return false;
      p.cash -= JAIL_FINE; p.inJail = false; p.jailTurns = 0; log(`${p.name} 繳交 ${JAIL_FINE} 元保釋出獄`); break;
    case 'useCard':
      if (s.step !== 'roll' || !p.inJail || p.jailCards < 1) return false;
      p.jailCards--; p.inJail = false; p.jailTurns = 0; log(`${p.name} 使用出獄許可證`); break;
    case 'build': if (!validIdx(a.idx) || !doBuild(p, a.idx)) return false; break;
    case 'sell': if (!validIdx(a.idx) || !doSell(p, a.idx)) return false; break;
    case 'item': if (!useItem(p, a.idx, a.target)) return false; break;
    default: return false;
  }
  if (s.phase === 'playing' && cur().bankrupt) nextTurn();
  return true;
}

function doRoll(p) {
  const d1 = 1 + Math.floor(Math.random() * 6), d2 = 1 + Math.floor(Math.random() * 6);
  s.dice = [d1, d2]; s.rollId++;
  const dbl = d1 === d2;
  log(`${p.name} 擲出 ${d1} + ${d2} = ${d1 + d2}${dbl ? '（對子！）' : ''}`);
  if (p.inJail) {

    if (st.step === 'roll') {
      if (c.inJail) actions = `<div class="hint">⛓️ 坐牢中（第 ${c.jailTurns + 1}/3 次）</div><button class="btn" onclick="A('roll')">🎲 擲骰（對子就出獄）</button>
        <div class="row2"><button class="btn alt" ${c.cash < JAIL_FINE ? 'disabled' : ''} onclick="A('payJail')">付 ${JAIL_FINE} 出獄</button>${c.jailCards ? `<button class="btn alt" onclick="A('useCard')">用出獄卡</button>` : ''}</div>`;
      else actions = `<button class="btn" onclick="A('roll')">🎲 擲骰子</button>`;
    } else if (st.step === 'buy') {
      const b = BOARD[st.pendingBuy];
      actions = `<button class="btn" onclick="A('buy')">買下${b.n}（$${b.p}）</button><button class="btn ghost" onclick="A('pass')">不買</button>`;
    } else actions = `<button class="btn alt" onclick="A('end')">結束回合 ➜</button>`;
    if (GROUPS.some((g, k) => ownsGroup(st, c.id, k))) actions += `<div class="hint">點自己的地可以蓋房子</div>`;
  } else actions = `<div class="hint">等待 ${esc(c.name)} 行動…</div>`;
  rest.innerHTML = `${msg}<div class="actions">${actions}</div>`;
}
function renderGame() {
  ensureBoard();
  const st = state, c = curP();
  for (let i = 0; i < BOARD.length; i++) updateCell(i);
  const roundTxt = st.maxRounds ? `第 ${st.round}/${st.maxRounds} 回合` : `第 ${st.round} 回合`;
  $('#gTop').innerHTML = `<button class="mini" onclick="leave()">← 離開</button><span>${mode !== 'local' ? '房號 ' + esc(roomCode) + ' · ' : ''}${roundTxt}</span><span class="sp"></span>
    ${lost ? '<button class="mini warn" onclick="reconnect()">⚠️ 連線中斷，點此重連</button>' : ''}`;
  $('#players').innerHTML = st.players.map((p, k) => {
    const n = Object.values(st.props).filter(pr => pr.owner === p.id).length;
    const tags = [`🏘️ ${n} 塊地`];
    if (p.inJail) tags.push('⛓️ 坐牢');
    if (p.jailCards) tags.push('🎫 ×' + p.jailCards);
    if (p.items && p.items.length) tags.push('🃏 ×' + p.items.length);
    if (p.skip) tags.push('🚸 暫停');
    if (!p.connected && !p.bankrupt) tags.push('📵 離線');
    if (p.bankrupt) tags.push('💀 破產');
    return `<div class="pl${k === st.turn && st.phase === 'playing' ? ' turn' : ''}${p.bankrupt ? ' out' : ''}" style="border-color:${p.color}">
      <div class="pn">${pawnMini(p.color)}${esc(p.name)}${mode !== 'local' && p.id === myId ? '（你）' : ''}${p.id === st.hostId ? ' 👑' : ''}</div>
      <div class="pc">$${p.cash.toLocaleString()}</div><div class="ps">${tags.join(' · ')}</div></div>`;
  }).join('');
  $('#log').innerHTML = `<h3>📜 紀錄</h3>${st.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join('')}`;
  const key = st.hostId + ':' + st.gameId;
  if (anim.key !== key) {
    anim.key = key; anim.shown = {}; anim.lastMoveId = st.moveId || 0; anim.diceUntil = 0;
    clearInterval(anim.diceTimer); lastRollShown = st.rollId;
    st.players.forEach(p => { anim.shown[p.id] = p.pos; });
    $('#pieces').innerHTML = ''; setDice(st.dice, false);
  } else if (st.rollId !== lastRollShown) { lastRollShown = st.rollId; rollDice(st.dice); }
  syncPieces();
  renderCenter();
  renderHand();
  runAnim();
  const tk = st.phase + ':' + st.turn + ':' + st.round;
  if (tk !== lastTurnKey) {
    lastTurnKey = tk;
    if (mode !== 'local' && st.phase === 'playing' && c.id === myId) { try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} }
  }
}
const DESC = {
  start: `每次經過或停在起點，可以領 ${PASS_GO} 元；剛好停在起點再送一張政策卡。`,
  chance: '抽一張機會卡，可能是好事，也可能是壞事。',
  policy: `抽一張政策卡（道具卡）。手上最多 ${HAND_MAX} 張，滿了再抽到會作廢。`,
  jail: `停在這裡只是探監。被關進來的人要擲出對子、付 ${JAIL_FINE} 元或用出獄許可證才能出來，最多關 3 回合。`,
  park: '休息一下，順手拿一張政策卡。',
  gotojail: '停在這裡會直接被送進監獄，不會經過起點領錢。',
  tax: '停在這裡要繳 1000 元所得稅。',
};
function openCell(i) { openItemK = null; openIdx = i; renderModal(); $('#modal').classList.remove('hidden'); }
function closeModal() { openIdx = null; openItemK = null; $('#modal').classList.add('hidden'); }
// ----- 政策卡手牌 -----
function handOwner() {
  const c = curP();
  if (mode === 'local') return c;
  if (mode === 'host' && c.id !== myId && canControl(c.id)) return c; // 代打
  return PS(myId);
}
function renderHand() {
  const el = $('#hand'), st = state, o = handOwner();
  if (!o || o.bankrupt || st.phase !== 'playing') { el.style.display = 'none'; return; }
  el.style.display = '';
  const proxy = mode === 'host' && o.id !== myId ? '（代打）' : '';
  const who = mode === 'local' || proxy ? `${pawnMini(o.color)}${esc(o.name)}${proxy} 的政策卡` : '我的政策卡';
  const cards = (o.items || []).map((k, i) => {
    const it = ITEMS[k], ok = !it.passive && itemCheck(st, o.id, k) === '' && (!it.target || itemTargets(st, o.id, k).length);
    return `<button class="itm${it.passive ? ' passive' : ''}" onclick="openItem(${i})"><div class="ii">${it.icon}</div><div class="in">${it.name}</div><div class="it">${it.passive ? '自動生效' : ok ? '可以使用' : '暫時不能用'}</div></button>`;
  }).join('');
  el.innerHTML = `<h3>🃏 ${who}（${(o.items || []).length}/${HAND_MAX}）</h3>${cards ? `<div class="itms">${cards}</div>` : '<div class="hint">停在 📜 政策格、🌳 公園，或剛好停在 🏁 起點，就能抽政策卡。</div>'}`;
}
function openItem(k) { openIdx = null; openItemK = k; renderItemModal(); $('#modal').classList.remove('hidden'); }
function renderItemModal() {
  const st = state, o = handOwner();
  if (!st || !o || !o.items || openItemK >= o.items.length) return closeModal();
  const key = o.items[openItemK], it = ITEMS[key];
  let h = `<div class="bigcard"><div class="ii">${it.icon}</div><h2>${it.name}</h2><p>${it.desc}</p></div>`;
  if (it.passive) h += '<p class="hint">這張卡會在條件符合時自動使用，不用手動操作。</p>';
  else {
    const reason = canControl(o.id) ? itemCheck(st, o.id, key) : '輪到自己的回合才能使用';
    if (reason || isAnimating()) h += `<button class="btn" disabled>使用</button><p class="hint">${isAnimating() ? '等動畫結束再使用' : reason}</p>`;
    else if (!it.target) h += `<button class="btn" onclick="A('item', ${openItemK})">使用</button>`;
    else {
      const opts = itemTargets(st, o.id, key);
      const q = { steps: '要前進幾格？', cell: '選擇地產：', player: '選擇玩家：' }[it.target];
      h += opts.length ? `<p><b>${q}</b></p><div class="opts">${opts.map(op => `<button class="btn alt" onclick='A("item", ${openItemK}, ${JSON.stringify(op.v)})'>${esc(op.label)}</button>`).join('')}</div>`
        : `<button class="btn" disabled>使用</button><p class="hint">目前沒有可以選的目標</p>`;
    }
  }
  h += '<p class="hint">每回合限用 1 張；手上最多 3 張。</p><button class="btn ghost" onclick="closeModal()">關閉</button>';
  $('#sheet').innerHTML = h;
}
function renderModal() {
  const i = openIdx, b = BOARD[i], st = state;
  if (!st) return closeModal();
  let h = '';
  if (b.t !== 'prop') h = `<h2>${ICONS[b.t]} ${b.n}</h2><p>${DESC[b.t]}</p>`;
  else {
    const pr = st.props[i] || { owner: null, level: 0 }, owner = pr.owner ? PS(pr.owner) : null, base = baseRent(i);
    h = `<span class="gband" style="background:${GROUPS[b.g].color}">${GROUPS[b.g].name}</span><h2>${b.n}</h2>
    <table class="rt"><tr><td>地價</td><td>$${b.p}</td></tr><tr><td>過路費（空地）</td><td>$${base}</td></tr>
    <tr><td>集滿同區（空地）</td><td>$${base * 2}</td></tr>
    ${[1, 2, 3].map(l => `<tr><td>${'🏠'.repeat(l)} ${l} 棟房子</td><td>$${base * RENT_MULT[l]}</td></tr>`).join('')}
    <tr><td>🏨 飯店</td><td>$${base * RENT_MULT[4]}</td></tr><tr><td>每次蓋房費用</td><td>$${buildCost(i)}</td></tr></table>
    <p>擁有者：${owner ? `<span class="dot" style="background:${owner.color}"></span>${esc(owner.name)}（${pr.level === MAX_LEVEL ? '飯店' : pr.level + ' 棟房子'}，目前過路費 <b>$${rentOf(st, i)}</b>）` : '還沒有人買'}</p>`;
    if (st.phase === 'playing' && owner && owner.id === curP().id && canControl(owner.id)) {
      const rb = canBuild(st, owner.id, i), rs = canSell(st, owner.id, i);
      if (pr.level < MAX_LEVEL) h += `<button class="btn" ${rb ? 'disabled' : ''} onclick="A('build',${i})">🏠 ${pr.level === 3 ? '升級成飯店' : '蓋一棟房子'}（-$${buildCost(i)}）</button>${rb ? `<p class="hint">${rb}</p>` : ''}`;
      h += `<button class="btn ghost" ${rs ? 'disabled' : ''} onclick="A('sell',${i})">${pr.level > 0 ? '賣掉一棟建築' : '把地賣回銀行'}（+$${sellValue(st, i)}）</button>${rs ? `<p class="hint">${rs}</p>` : ''}`;
    } else if (owner && canControl(owner.id) && st.phase === 'playing') h += '<p class="hint">輪到自己的回合時，可以在這裡蓋房子或變賣</p>';
  }
  h += '<button class="btn ghost" onclick="closeModal()">關閉</button>';
  $('#sheet').innerHTML = h;
}
render();
</script>
